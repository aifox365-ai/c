<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<link rel="manifest" href="manifest.json">
<title>每日抽牌</title>

<!-- iOS / PWA 設定 -->
<meta name="theme-color" content="#111827" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="每日抽牌" />

<style>
* {
box-sizing: border-box;
-webkit-tap-highlight-color: transparent;
}
html, body {
margin: 0;
padding: 0;
width: 100%;
height: 100%;
overflow: hidden;
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
background: radial-gradient(circle at top, #374151 0%, #111827 45%, #030712 100%);
color: #fff;
}
.container {
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
height: 100vh;
padding: 20px;
}
.card-area {
width: 100%;
max-width: 320px;
height: 460px;
margin-bottom: 30px;
perspective: 1000px;
display: flex;
align-items: center;
justify-content: center;
}
.card-img {
max-width: 100%;
max-height: 100%;
border-radius: 16px;
box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
object-fit: contain;
transition: transform 0.3s ease, opacity 0.3s ease;
}
.btn {
background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
color: #ffffff;
border: none;
padding: 16px 36px;
font-size: 1.1rem;
font-weight: 600;
border-radius: 9999px;
box-shadow: 0 4px 15px rgba(79, 70, 229, 0.4);
cursor: pointer;
transition: transform 0.1s ease, box-shadow 0.2s ease;
}
.btn:active {
transform: scale(0.95);
}
</style>
</head>
<body>

<div class="container">
<div class="card-area">
<img id="cardImage" class="card-img" src="images2/1.jpg" alt="卡牌展示" />
</div>
<button class="btn" onclick="drawCard()">開始抽牌</button>
</div>

<script>
const totalCards = 14; // 卡片總數設定為 14 張

function drawCard() {
const cardImage = document.getElementById('cardImage');

// 動畫效果：先縮小淡出
cardImage.style.transform = 'scale(0.8)';
cardImage.style.opacity = '0';

setTimeout(() => {
// 隨機抽取 1 ~ 14
const randomNum = Math.floor(Math.random() * totalCards) + 1;
cardImage.src = `images2/${randomNum}.jpg`;

// 動畫效果：還原放大淡入
cardImage.style.transform = 'scale(1)';
cardImage.style.opacity = '1';
}, 200);
}
</script>

</body>
</html>
